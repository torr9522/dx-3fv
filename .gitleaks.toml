[extend]
useDefault = true

[[allowlists]]
description = "Forward navigation localStorage constant names are not credentials"
regexTarget = "match"
regexes = ['''FORWARD_NAV_STORAGE_KEY''']

[[allowlists]]
description = "Truncated JWT documentation example retained in the sanitized root commit"
regexTarget = "match"
regexes = ['''eyJhbGciOiJIUzI1NiIs\.\.\.''']
